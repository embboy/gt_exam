name: production-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Apply Flyway migrations
        working-directory: .
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          readarray -t FLYWAY_CONFIG < <(node -e '
            const connection = new URL(process.env.DIRECT_URL);
            const port = connection.port || "5432";
            console.log(`jdbc:postgresql://${connection.hostname}:${port}${connection.pathname}${connection.search}`);
            console.log(decodeURIComponent(connection.username));
            console.log(decodeURIComponent(connection.password));
          ')
          export FLYWAY_URL="${FLYWAY_CONFIG[0]}"
          export FLYWAY_USER="${FLYWAY_CONFIG[1]}"
          export FLYWAY_PASSWORD="${FLYWAY_CONFIG[2]}"
          node -e '
            const { Client } = require("./frontend/node_modules/pg");
            const client = new Client({ connectionString: process.env.DIRECT_URL });
            client.connect()
              .then(() => client.query("SELECT 1"))
              .then(() => client.end())
              .catch(async (error) => {
                console.error(`Direct database connection failed: ${error.message}`);
                try { await client.end(); } catch {}
                process.exit(1);
              });
          '
          echo "Direct database connection succeeded; applying Flyway migrations."
          docker run --rm --network host \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            -v "$GITHUB_WORKSPACE/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -connectRetries=3 migrate
      - name: Link Vercel project
        run: |
          rm -rf .vercel
          mkdir .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Pull Vercel production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build Vercel output
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy prebuilt output
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}