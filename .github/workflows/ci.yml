name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn --batch-mode verify

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required contracts
        shell: bash
        run: |
          test -f docs/openapi.yaml
          test -f backend/src/main/resources/db/migration/V1__baseline.sql
          grep -q "2016.*2025" PRD.md
          grep -q "uq_official_mock_question" DB_SCHEMA.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/gtexam
          AUTH_SECRET: ci-build-placeholder-secret-must-be-at-least-32-bytes

  ai-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s ai/validators -p "test_*.py" -v